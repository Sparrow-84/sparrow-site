<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Watch a short clip from Sparrow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4D30"/>
      <stop offset="1" stop-color="#163A24"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- play button -->
  <circle cx="640" cy="330" r="72" fill="#F0A500"/>
  <path d="M620 296 L620 364 L676 330 Z" fill="#1A1A1A"/>
  <!-- wordmark + hint -->
  <text x="640" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" fill="#FFFFFF">Sparrow</text>
  <text x="640" y="516" text-anchor="middle" font-family="Arial, system-ui, sans-serif" font-size="24" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.7">PRESS PLAY</text>
</svg>
